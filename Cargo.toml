[package]
name = "orderbook-tui"
version = "0.1.0"
edition = "2024"
description = "Real-time order book DOM ladder for the terminal"
license = "MIT"
repository = "https://github.com/lmeow01/orderbook-tui"
rust-version = "1.88"

[lib]
name = "ob"
path = "src/lib.rs"

[[bin]]
name = "ob"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "http2", "query"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["raw_value"] }
tokio = { version = "1.53.2", features = ["rt", "net", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
triple_buffer = "9.0.0"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"

[[bench]]
name = "book"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
